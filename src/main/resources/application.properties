spring.application.name=ticketapp

spring.datasource.url=jdbc:postgresql://localhost:5433/ticketapp?currentSchema=public
spring.datasource.username=postgres
spring.datasource.password=devpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/event-ticket-platform

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
